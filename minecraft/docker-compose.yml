version: "3.8"
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "25565:25565"
      - "25575:25575"
      - "8123:8123"
      - "19132:19132/udp"
      - "24454:24454/udp"
    mem_limit: 6g
    mem_reservation: 4g
    environment:
      ONLINE_MODE: "false"
      EULA: "TRUE"
      TYPE: "FABRIC"
      FABRIC_LOADER_VERSION: "0.19.3"
      VERSION: "26.1.2"
      SERVER_NAME: "Mi Servidor"
      MOTD: "§6Servidor §r| §aOnline"
      MAX_TICK_TIME: "60000"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "75"
      JVM_XX_OPTS: >-
        -XX:+UseZGC
        -XX:+ZGenerational
        -XX:+AlwaysPreTouch
        -XX:+UseStringDeduplication
        -XX:+UseCompactObjectHeaders
        -XX:+DisableExplicitGC
        -XX:+PerfDisableSharedMem
      JVM_OPTS: "-Xms2G -Xmx4500M"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_PLAYERS: "20"
      SYNC_CHUNK_WRITES: "false"
      ENABLE_ROLLING_LOGS: "true"
      TZ: "${TZ:-UTC}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "25575"
    volumes:
      - /mnt/hdd/minecraft/data:/data
    stdin_open: true
    tty: true
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 30s
      timeout: 10s
      retries: 5

  rcon-web:
    image: itzg/rcon:latest
    container_name: minecraft_rcon
    restart: unless-stopped
    environment:
      RWA_USERNAME: "admin"
      RWA_PASSWORD: "${RWA_PASSWORD}"
      RWA_RCON_HOST: "minecraft"
      RWA_RCON_PORT: "25575"
      RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
      RWA_WEBSOCKET_ADDRESS: "ws://${HOST_IP}:4327"
    ports:
      - "4326:4326"
      - "4327:4327"
    depends_on:
      - minecraft